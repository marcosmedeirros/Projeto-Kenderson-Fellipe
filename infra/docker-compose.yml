# Opção para VPS (Oracle ou Hostinger VPS). Na hospedagem Node.js da Hostinger não é usado.
#   1. cp .env.example .env  e preencha tudo
#   2. docker compose up -d --build
#   3. Evolution junto (opcional): docker compose --profile evolution up -d --build
#
# Só o Caddy expõe portas (80/443). Painel, banco e Evolution ficam na rede interna.

name: controladoria

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PAINEL_DOMINIO: ${PAINEL_DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - painel

  painel:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: https://${PAINEL_DOMINIO}
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USER: controladoria
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: controladoria
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: controladoria
      MARIADB_USER: controladoria
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Opcional: Evolution API (WhatsApp) na mesma VM ----
  # Se o Evolution já roda em outro lugar, não use este perfil: cadastre a URL dele em Integrações.
  evolution:
    profiles: ["evolution"]
    # Fixe uma versão testada em vez de "latest" antes de ir para produção.
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    environment:
      SERVER_URL: https://${EVOLUTION_DOMINIO}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgres://evolution:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - evolution-postgres
      - redis

  evolution-postgres:
    profiles: ["evolution"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  redis:
    profiles: ["evolution"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  mariadb_data:
  evolution_instances:
  evolution_postgres_data:
  redis_data:
